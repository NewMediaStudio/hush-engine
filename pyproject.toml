[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hush-engine"
version = "1.12.0"
description = "Local-first PII detection engine using Presidio and Apple Vision OCR"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "Valentine Makhouleen", email = "valentine@newmediastudio.com"}
]
requires-python = ">=3.10"
keywords = ["pii", "privacy", "detection", "ocr", "presidio", "anonymization", "data-security", "international", "iban", "gdpr", "hipaa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: MacOS :: MacOS X",
]

dependencies = [
    # Core numerics
    "numpy>=1.24.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "Pillow>=10.0.0",
    "pdf2image>=1.17.0",
    "img2pdf>=0.6.3",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "faker>=20.0.0",
    # macOS native frameworks (Vision, NaturalLanguage, Cocoa)
    "pyobjc-framework-Vision>=9.0",
    "pyobjc-framework-Cocoa>=9.0",
    "pyobjc-framework-NaturalLanguage>=9.0",
    "watchdog>=3.0.0",
    # Image optimization (Apache 2.0 / BSD)
    "zopfli>=0.2.0",
    "mozjpeg-lossless-optimization>=1.0.0",
    # PII Validation (LGPL-2.1 — safe for proprietary linking when library-distributed)
    "python-stdnum>=2.2",
    "phonenumbers>=9.0.0",
    # Natural language date parsing (BSD)
    "dateparser>=1.2.0",
    # Lightweight ML (MIT)
    "lightgbm>=4.0.0",
    # PDF text extraction (MIT)
    "pdfplumber>=0.10.0",
]

[project.optional-dependencies]
# Extended name validation (GPL-3.0 — opt-in due to license).
# Hush ships a built-in curated NamesDatabase (7,500+ names across 54 locales)
# that works without this extra. Install for broader coverage.
names = [
    "names-dataset>=3.1.0",
]
# Medical NER (MIT) — zero dependencies, lightweight
medical = [
    "medical-named-entity-recognition>=0.1.0",
    "drug-named-entity-recognition>=0.1.0",
]
# Address parsing (MIT) — requires system libpostal: brew install libpostal
address = [
    "postal>=1.1.9",
]
# Heavy NER models for maximum accuracy (~2GB)
accurate = [
    "flair>=0.13.0",
    "transformers>=4.30.0",
    "gliner>=0.2.0",
]
# OpenAI Privacy Filter (~3GB BF16, Apache-2.0)
# Bidirectional token classifier for PII spans; opt-in add-on backend.
privacy-filter = [
    "transformers>=4.40.0",
    "torch>=2.0.0",
]
# Everything (excluding the GPL names extra — add it explicitly if you want it)
full = [
    "hush-engine[medical,address,accurate,privacy-filter]",
]
# Development and testing
dev = [
    "presidio-evaluator>=0.1.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "scikit-learn>=1.3.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/NewMediaStudio/hush-engine"
Repository = "https://github.com/NewMediaStudio/hush-engine"
Issues = "https://github.com/NewMediaStudio/hush-engine/issues"
Changelog = "https://github.com/NewMediaStudio/hush-engine/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["hush_engine*"]

[tool.setuptools.package-data]
hush_engine = ["*.json", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "E402",  # module-import-not-at-top (we use conditional imports intentionally)
    "E731",  # lambda-assignment (used for stub fallbacks when optional deps missing)
    "E722",  # bare-except (used in optional-dependency import guards)
    "F841",  # unused-variable (too noisy in data-processing code with tuple unpacking)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401", "F811"]
