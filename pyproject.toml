[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hush-engine"
version = "1.8.0"
description = "Local-first PII detection engine using Presidio and Apple Vision OCR"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Valentine Makhouleen", email = "valentine@newmediastudio.com"}
]
requires-python = ">=3.10"
keywords = ["pii", "privacy", "detection", "ocr", "presidio", "anonymization", "data-security", "international", "iban", "gdpr", "hipaa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: MacOS :: MacOS X",
]

dependencies = [
    # Core numerics - relaxed numpy constraint now that spaCy is optional
    "numpy>=1.24.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "Pillow>=10.0.0",
    "pdf2image>=1.17.0",
    "img2pdf>=0.6.3",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "faker>=20.0.0",
    # macOS native frameworks (Vision, NaturalLanguage, Cocoa)
    "pyobjc-framework-Vision>=9.0",
    "pyobjc-framework-Cocoa>=9.0",
    "pyobjc-framework-NaturalLanguage>=9.0",  # v1.8.0: NLTagger for NER/lemmatization
    "watchdog>=3.0.0",
    # Image optimization (commercial-friendly licenses)
    "zopfli>=0.2.0",  # Apache 2.0 - PNG compression
    "mozjpeg-lossless-optimization>=1.0.0",  # BSD-3 - JPEG optimization
    # PII Validation (LGPL-2.1 license)
    "python-stdnum>=2.2",  # National ID, IBAN, BIC validation for 35+ countries
    "phonenumbers>=9.0.0",  # International phone validation for 249 countries
    "dateparser>=1.2.0",  # Natural language date parsing (BSD license)
    # Lightweight ML (MIT license) - fast, low-memory NER
    "lightgbm>=4.0.0",  # MIT license - Gradient boosting for token classification
    "names-dataset>=3.1.0",  # GPL-3.0 - First/last name validation
    # Medical NER (MIT license) - zero dependencies, lightweight
    "medical-named-entity-recognition>=0.1.0",  # MIT - Disease/condition detection
    "drug-named-entity-recognition>=0.1.0",  # MIT - Drug/medication detection
    # PDF text extraction (MIT license) - supplements OCR for small text in digital PDFs
    "pdfplumber>=0.10.0",  # MIT - Direct text extraction with positions
]

[project.optional-dependencies]
# spaCy NLP engine (v1.8.0: now optional, replaced by NLTagger for Minimal tier)
spacy = [
    "spacy>=3.7.0",  # Industrial-grade NER (~100-200MB with model)
]
# OpenCV + pyzbar (v1.8.0: now optional, replaced by Vision framework)
opencv = [
    "opencv-python>=4.8.0",  # Haar cascade face detection fallback
    "pyzbar>=0.1.9",  # Linear barcode detection fallback
]
# Heavy NER models for maximum accuracy (adds ~2GB)
accurate = [
    "flair>=0.13.0",  # MIT license - Flair NER models (~400MB)
    "transformers>=4.30.0",  # Apache 2.0 - HuggingFace transformer models (~600MB)
    "gliner>=0.2.0",  # Apache 2.0 - Zero-shot NER (~1GB)
]
# Everything
full = [
    "hush-engine[spacy,opencv,accurate]",
]
dev = [
    "presidio-evaluator>=0.1.0",  # Token-level evaluation and debugging
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "scikit-learn>=1.3.0",  # For model training and evaluation
]

[project.urls]
Homepage = "https://github.com/NewMediaStudio/hush-engine"
Repository = "https://github.com/NewMediaStudio/hush-engine"
Issues = "https://github.com/NewMediaStudio/hush-engine/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["hush_engine*"]

[tool.setuptools.package-data]
hush_engine = ["*.json", "*.txt"]
