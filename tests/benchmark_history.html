<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hush Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="icons/hush-1024.png">
    <link rel="stylesheet" href="benchmark_history.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="logo" onclick="toggleView('trend')" style="cursor: pointer;" title="Back to Total Runs">
            <img src="icons/hush-1024.png" alt="Hush" style="width: 40px; height: 40px;" id="logo-bee">
            <span>Hush</span><span style="font-weight: 300;">Engine</span>
        </div>
    <div style="display: flex; gap: 0.75rem; align-items: center;">
            <button class="job-status-btn hidden" id="job-status-btn" onclick="toggleProgressBanner()">
                <span class="job-status-indicator"></span>
                <span class="job-status-text" id="job-status-text">Loading PDF...</span>
                <span class="job-status-percent" id="job-status-percent">0%</span>
            </button>
            <button class="stop-btn hidden" onclick="stopBenchmark()" id="stop-test-btn">Stop</button>
            <button class="run-btn" onclick="openRunDrawer()" id="run-test-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                Run Test
            </button>
        </div>
    </div>

    <div class="drawer-overlay" id="drawer-overlay" onclick="closeRunDrawer()"></div>

    <div class="drawer" id="run-drawer">
        <div class="drawer-header">
            <div class="drawer-title">Configure Benchmark</div>
            <button class="drawer-close" onclick="closeRunDrawer()">&times;</button>
        </div>
        <div class="drawer-body">
            <div class="form-group">
                <label class="form-label">Number of Samples</label>
                <input type="number" class="form-input" id="sample-count" value="1000" min="10" max="5000" step="10" style="width: 120px;">
                <div class="form-help">Recommended: 100-500 for quick tests, 1000+ for accurate results</div>
            </div>

            <div class="form-group">
                <label class="form-label">Test Format</label>
                <div class="radio-group">
                    <div class="radio-item">
                        <input type="radio" name="test-format" id="format-both" value="both" checked>
                        <label for="format-both">Both</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" name="test-format" id="format-csv" value="csv">
                        <label for="format-csv">CSV Only</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" name="test-format" id="format-pdf" value="pdf">
                        <label for="format-pdf">PDF Only</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Datasets</label>
                <div class="checkbox-group" style="flex-direction: column; gap: 0.5rem;">
                    <div class="checkbox-item">
                        <input type="checkbox" id="dataset-synthetic" value="synthetic_golden.json" checked>
                        <label for="dataset-synthetic">synthetic_golden.json (Faker)<br><span class="dataset-detail">9 types, 1k samples</span></label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="dataset-ai4privacy" value="sample_3000.json" checked>
                        <label for="dataset-ai4privacy">sample_3000.json (ai4privacy/pii-masking-300k)<br><span class="dataset-detail">27 types, 3k samples</span></label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="dataset-2" value="pii_dataset_2.parquet">
                        <label for="dataset-2">pii_dataset_2.parquet<br><span class="dataset-detail">50 types, 100k samples</span></label>
                    </div>
                </div>
                <div class="form-help">Synthetic data recommended for consistent benchmarks</div>
            </div>

            <div class="form-group">
                <label class="form-label">Options</label>
                <div class="checkbox-group" style="flex-direction: column; gap: 0.75rem;">
                    <div class="checkbox-item">
                        <input type="checkbox" id="fast-mode">
                        <label for="fast-mode">Fast mode (spaCy only, skip GLiNER/Flair)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="keep-files">
                        <label for="keep-files">Keep generated test files</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="save-feedback" checked>
                        <label for="save-feedback">Save feedback for training</label>
                    </div>
                    <div class="checkbox-item" style="display: flex; align-items: center; gap: 1rem;">
                        <input type="checkbox" id="loop-mode" onchange="toggleLoopCount()">
                        <label for="loop-mode">Loop mode</label>
                        <div id="loop-count-container" style="display: none; align-items: center; gap: 0.5rem;">
                            <input type="number" id="loop-count" value="3" min="2" max="100" style="width: 60px; padding: 0.4rem; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.9rem;">
                            <span style="color: var(--muted); font-size: 0.85rem;">runs</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="drawer-footer">
            <button class="drawer-run-btn" onclick="startBenchmark()" id="start-benchmark-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                Start Benchmark
            </button>
        </div>
    </div>

    <div id="progress-banner" class="progress-banner">
        <div class="progress-header">
            <div class="progress-title">
                <span class="pulse"></span>
                <span id="progress-phase">Running Benchmark...</span>
            </div>
        </div>
        <div class="progress-bar-wrapper">
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-bar" style="width: 0%"></div>
            </div>
            <div class="progress-bar-text" id="progress-text">0%</div>
        </div>
        <div class="progress-details" style="grid-template-columns: repeat(6, 1fr);">
            <div class="progress-detail">
                <div class="progress-detail-value" id="progress-samples">0/0</div>
                <div class="progress-detail-label">Samples</div>
            </div>
            <div class="progress-detail">
                <div class="progress-detail-value" id="progress-sets">0/0</div>
                <div class="progress-detail-label">Sets</div>
            </div>
            <div class="progress-detail">
                <div class="progress-detail-value" id="progress-set-samples">--</div>
                <div class="progress-detail-label">Current Set</div>
            </div>
            <div class="progress-detail">
                <div class="progress-detail-value" id="progress-detections">0</div>
                <div class="progress-detail-label">PII Found</div>
            </div>
            <div class="progress-detail">
                <div class="progress-detail-value" id="progress-speed">--</div>
                <div class="progress-detail-label">Samples/sec</div>
            </div>
            <div class="progress-detail">
                <div class="progress-detail-value" id="progress-elapsed">00:00</div>
                <div class="progress-detail-label">Time Elapsed</div>
            </div>
        </div>
    </div>

    <div id="dashboard">
        <div class="stats-scroll-wrapper">
            <button class="scroll-chevron" id="scroll-left" onclick="scrollStats(-1)" title="Scroll left">&#8249;</button>
            <div class="stats-grid" id="stats-grid"></div>
            <button class="scroll-chevron" id="scroll-right" onclick="scrollStats(1)" title="Scroll right">&#8250;</button>
        </div>

        <div class="main-card">
            <div class="chart-tabs hidden" id="chart-tabs">
                <div class="format-filter" id="format-filter">
                    <button class="format-pill active" data-format="both" onclick="filterByFormat('both')">Both</button>
                    <button class="format-pill" data-format="csv" onclick="filterByFormat('csv')">CSV</button>
                    <button class="format-pill" data-format="pdf" onclick="filterByFormat('pdf')">PDF</button>
                    <button class="format-pill" data-format="all" onclick="filterByFormat('all')">All</button>
                </div>
                <select id="sample-filter" class="sample-filter" onchange="filterBySamples()">
                    <option value="all">All sample sizes</option>
                    <option value="under1000">Under 1,000 samples</option>
                    <option value="1000plus" selected>1,000 samples and over</option>
                </select>
            </div>
            <div class="chart-container" id="chart-container">
                <canvas id="canvas"></canvas>
            </div>
            <div id="chart-legend" class="chart-legend"></div>
            <div id="speed-chart-section" class="speed-chart-section hidden">
                <div id="speed-chart-container" style="height: 400px; position: relative;">
                    <canvas id="speed-canvas"></canvas>
                </div>
                <div id="speed-chart-legend" class="chart-legend"></div>
            </div>
            <div id="table-container" class="hidden"></div>
            <div id="pagination-controls" class="pagination-controls hidden"></div>
        </div>
    </div>
</div>

<script src="benchmark_history.js"></script>
<script>
(function() {
    const bee = document.getElementById('logo-bee');
    const openEye = 'icons/hush-1024.png';
    const closedEye = 'icons/hush-1024-blink.png';

    function blink() {
        bee.src = closedEye;
        setTimeout(() => { bee.src = openEye; }, 150);
    }

    // Blink every 3-5 seconds (random interval for natural feel)
    function scheduleBlink() {
        const delay = 3000 + Math.random() * 2000;
        setTimeout(() => {
            blink();
            scheduleBlink();
        }, delay);
    }

    scheduleBlink();
})();
</script>
</body>
</html>
